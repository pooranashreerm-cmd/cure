<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curevia – Smart Medicine Reminder & EHR Companion</title>
    <meta name="description" content="Your Health. Your Records. Your Reminder. Digital EHR and medicine reminder platform for patients, doctors, community health workers, and pharmacies." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <meta property="og:title" content="Curevia – Smart Healthcare, Simplified" />
    <meta property="og:description" content="Manage medicines, appointments, prescriptions and electronic health records in one secure platform." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('curevia_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
